name: Android PR Checks

on:
  pull_request:
  push:
    branches: [master]

jobs:
  quality-gate:
    name: Lint / Test / Assemble
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Robolectric 在**跑测试时**才去 Maven 拉 `android-all-instrumented`（放在 ~/.m2，
      # setup-gradle 只缓存 Gradle 自己的依赖，不会覆盖这里）。不缓存的话每个 run 都要
      # 现场下载一次，Maven 抖一下就整批用例一起挂 —— 2026-09-23 run 35823802499 就是
      # 这样红的：那个 job 里**每一个** Robolectric 用例都
      # `AssertionError at MavenArtifactFetcher.java:129`，与代码无关。
      - name: Cache Robolectric android-all jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-${{ runner.os }}-

      # core:workspace 的交互式终端 PTY（src/main/cpp/termux_pty.cpp）需要 NDK + CMake。
      # runner 自带的 Android SDK 不含这两样，且版本必须与 core/workspace/build.gradle.kts
      # 里的 ndkVersion 一致。
      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Lint (all modules)
        run: |
          set -o pipefail
          ./gradlew --console=plain --continue lintDebug 2>&1 | tee /tmp/lint.log

      # CI 原始日志下载需要更高权限（普通 PAT 401）。把真正的错误打成 ::error 注解，
      # 用 check-runs annotations 就能公开读到（.workbuddy/tools/ci_annotations.py）。
      - name: Surface lint failure details
        if: failure()
        shell: bash
        run: |
          if [ ! -f /tmp/lint.log ]; then
            echo "::error::lint.log 不存在（步骤可能在 tee 之前就挂了）"
            exit 0
          fi
          grep -nE "Error:|e: |FAILURE:|Exception|OutOfMemory|Lint found|What went wrong" /tmp/lint.log | head -40 | while IFS= read -r line; do
            echo "::error::${line:0:500}"
          done
          echo "::error::—— lint.log 最后 20 行 ——"
          tail -20 /tmp/lint.log | while IFS= read -r line; do
            echo "::error::${line:0:500}"
          done

      - name: Unit tests (all modules)
        shell: bash
        run: |
          set -o pipefail
          # -PciSkipFlakyTests：跳过只在 CI 上会卡的 3 个类（本地门禁仍跑全量），见 PORTING §5.40
          ./gradlew --console=plain --continue testDebugUnitTest -PciSkipFlakyTests 2>&1 | tee /tmp/unit-tests.log

      - name: Surface failed tests as annotations
        if: failure()
        run: |
          python3 tools/ci_test_failures.py .
          python3 tools/ci_log_exceptions.py /tmp/unit-tests.log

      - name: Assemble debug APK
        run: ./gradlew --console=plain :app:assembleDebug

      - name: Verify every module with sources has tests
        shell: bash
        run: |
          set -euo pipefail
          count_files() {
            if [ -d "$1" ]; then find "$1" -name "$2" | wc -l; else echo 0; fi
          }
          missing=0
          for m in app core/common core/ui core/data core/llm core/workspace feature/chat feature/assistant feature/settings feature/utility; do
            main=$(count_files "$m/src/main" '*.kt')
            test=$(($(count_files "$m/src/test" '*Test.kt') + $(count_files "$m/src/androidTest" '*Test.kt')))
            if [ "$main" -gt 0 ] && [ "$test" -eq 0 ]; then
              echo "::error::$m has $main source files and no tests"
              missing=1
            fi
          done
          exit $missing

      # 2026-09-24 起项目与上游 Flutter 完全解耦：strings.xml 直接手维（无生成器）。
      # 只保留 drift_schema 的生成检查（输入 drift_schemas/ 在本仓内）。
      - name: Verify generated resources are committed
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/drift_schema_to_sql.py
          git diff --exit-code -- core/data/src/main || {
            echo "::error:: Generated resources are stale. Run the generators in tools/ and commit the output."
            exit 1
          }
