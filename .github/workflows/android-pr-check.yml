name: Android PR Checks

on:
  pull_request:
    paths:
      - 'kelivo-android/**'
  push:
    branches: [master]
    paths:
      - 'kelivo-android/**'

jobs:
  quality-gate:
    name: Lint / Test / Assemble
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint
        working-directory: kelivo-android
        run: ./gradlew --console=plain :app:lintDebug

      - name: Unit tests
        working-directory: kelivo-android
        run: ./gradlew --console=plain :app:testDebugUnitTest

      - name: Assemble debug APK
        working-directory: kelivo-android
        run: ./gradlew --console=plain :app:assembleDebug

      - name: Verify generated resources are committed
        working-directory: kelivo-android
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/arb_to_android.py
          python3 tools/settings_keys_gen.py
          git diff --exit-code -- core/ui/src/main/res core/data/src/main/java/com/psyche/kelivo/data/settings/SettingsKeyRegistry.kt || {
            echo "::error:: Generated resources are stale. Run the tools and commit the output."
            exit 1
          }
