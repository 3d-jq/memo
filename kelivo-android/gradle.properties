org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# java home for daemon + test workers (system JAVA_HOME points at jdk-13, which
# breaks AGP; keep it pinned here). Colon escaped for the properties parser.
org.gradle.java.home=C\:/Program Files/Java/jdk-21.0.10
android.useAndroidX=true
android.nonTransitiveRClass=true
# Quality gates: parallel + cache to keep CI containers fast
org.gradle.parallel=true
org.gradle.caching=true
